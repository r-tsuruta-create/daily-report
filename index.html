<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日報ジェネレーター</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #fbfaf7;
      --bg2: #f0ede8;
      --surface: #ffffff;
      --surface2: #fdfbf8;
      --text: #21222a;
      --muted: #7b7f8e;
      --faint: #bac1cc;
      --border: #ede8df;
      --border2: #f2eee8;
      --danger: #d0463b;
      --danger-bg: #fbeae8;
      --ok: #1f9d64;
      --accent: #3a6fd0;
      --shadow: 0 1px 2px rgba(20, 20, 30, .03), 0 12px 28px -24px rgba(20, 20, 30, .22);
    }

    body.theme-dark {
      --bg: #17191f;
      --bg2: #0f1116;
      --surface: #20232b;
      --surface2: #282c35;
      --text: #f0f1f4;
      --muted: #b6bac6;
      --faint: #858b98;
      --border: #323744;
      --border2: #2c303a;
      --danger-bg: #3a1d1b;
      --shadow: 0 1px 2px rgba(0, 0, 0, .25), 0 16px 40px -24px rgba(0, 0, 0, .8);
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      background: var(--bg2);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button,
    input,
    textarea,
    select {
      color: inherit;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    input,
    textarea,
    select {
      min-width: 0;
      border: 1px solid var(--border);
      background: var(--surface2);
      border-radius: 12px;
      padding: 9px 11px;
      outline: none;
    }

    textarea {
      resize: vertical;
    }

    .app-shell {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      background: var(--bg2);
    }

    .phone {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      flex: none;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(14px);
    }

    .title {
      flex: 1;
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .date-label {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      color: var(--muted);
    }

    .account-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 190px;
      padding: 4px 10px 4px 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c8cf0, #a06cd0);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      flex: none;
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .subbar {
      flex: none;
      z-index: 15;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      padding: 9px 17px 10px;
    }

    .segmented {
      display: flex;
      gap: 3px;
      padding: 4px;
      border: 0;
      background: var(--bg2);
      border-radius: 12px;
    }

    .segmented button {
      flex: 1;
      border: 0;
      border-radius: 9px;
      padding: 9px 8px;
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 800;
    }

    .segmented button.active {
      background: var(--surface);
      color: var(--accent);
      box-shadow: 0 1px 2px rgba(20, 20, 30, .04);
    }

    .quick-copy {
      width: 100%;
      margin-top: 10px;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
      background: color-mix(in srgb, var(--accent) 7%, var(--surface));
      color: var(--accent);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 12.5px;
      font-weight: 800;
    }

    .taco-meter {
      display: grid;
      gap: 7px;
    }

    .meter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      font-weight: 800;
    }

    .meter-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: color-mix(in srgb, var(--text) 9%, transparent);
    }

    .meter-fill {
      height: 100%;
      width: var(--meter, 0%);
      border-radius: 99px;
      background: var(--accent);
      transition: width .2s ease;
    }

    .meter-over .meter-fill {
      background: var(--danger);
    }

    .content {
      flex: 1;
      overflow: auto;
      padding: 17px 17px calc(96px + env(safe-area-inset-bottom));
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 13px;
    }

    .screen.active {
      display: flex;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 0 4px;
      font-size: 13px;
      font-weight: 800;
      color: color-mix(in srgb, var(--muted) 70%, var(--surface));
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .card-body {
      padding: 14px;
    }

    .category-card {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      gap: 8px;
      padding: 12px 13px;
    }

    .handle-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0;
      padding-top: 2px;
    }

    .icon-button,
    .handle-button {
      border: 0;
      background: transparent;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--faint);
      font-weight: 800;
    }

    .handle-button {
      width: 18px;
      height: 18px;
      font-size: 0;
    }

    .handle-button::before {
      content: "⋮";
      color: color-mix(in srgb, var(--faint) 76%, var(--accent));
      font-size: 14px;
      line-height: 1;
    }

    .icon-button:hover,
    .handle-button:hover {
      background: var(--surface2);
      color: var(--accent);
    }

    .category-main {
      min-width: 0;
      display: grid;
      gap: 10px;
    }

    .category-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 28px;
      align-items: center;
      gap: 6px;
    }

    .category-input {
      font-weight: 800;
      border-color: transparent;
      background: transparent;
      color: color-mix(in srgb, var(--accent) 38%, var(--text));
      padding: 8px 4px;
    }

    .category-input:focus {
      border-color: var(--border);
      background: var(--surface2);
      padding-inline: 10px;
    }

    .task-list {
      display: grid;
      gap: 8px;
    }

    .task-row {
      display: grid;
      grid-template-columns: 18px 92px minmax(0, 1fr) 28px;
      gap: 6px;
      align-items: center;
    }

    .hours-control {
      display: grid;
      grid-template-columns: 24px 44px 24px;
      gap: 2px;
      align-items: center;
    }

    .hours-control input {
      height: 34px;
      padding: 0 2px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: var(--surface);
      color: var(--muted);
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      margin: 0;
      appearance: none;
    }

    .mini-button {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 9px;
      height: 34px;
      width: 24px;
      color: var(--muted);
      font-weight: 800;
      padding: 0;
    }

    .preset-row {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .add-label {
      color: var(--faint);
      font-size: 11px;
      font-weight: 800;
      flex: none;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      border: 1px solid color-mix(in srgb, var(--accent) 13%, var(--border));
      background: var(--surface);
      color: color-mix(in srgb, var(--accent) 28%, var(--muted));
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 700;
    }

    .primary,
    .secondary,
    .danger-button {
      border: 0;
      border-radius: 8px;
      padding: 11px 12px;
      font-weight: 800;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .secondary {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
    }

    .add-group-button {
      background: transparent;
      border-style: dashed;
      color: color-mix(in srgb, var(--accent) 45%, var(--muted));
    }

    .category-card .secondary[data-action="add-task"] {
      justify-self: start;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      color: var(--faint);
    }

    .greeting-button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 12px 14px;
      color: var(--faint);
      background: var(--surface2);
      border-radius: 12px;
    }

    .greeting-button::before {
      content: "○";
      color: color-mix(in srgb, var(--accent) 28%, var(--faint));
      font-size: 16px;
    }

    .danger-button {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .button-row {
      display: flex;
      gap: 9px;
    }

    .button-row button {
      flex: 1;
    }

    pre.output {
      margin: 0;
      padding: 11px 13px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      font-size: 12.5px;
      line-height: 1.75;
    }

    .output-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border2);
      background: var(--surface2);
      font-size: 12.5px;
      font-weight: 800;
    }

    .inline-form {
      display: grid;
      gap: 9px;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .contact-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 34px;
    }

    .contact-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 8px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 12%, var(--surface));
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    .contact-tag button {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      font-weight: 800;
    }

    .settings-row {
      display: grid;
      gap: 9px;
    }

    .accent-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .swatch {
      height: 34px;
      border: 2px solid transparent;
      border-radius: 8px;
    }

    .swatch.active {
      border-color: var(--text);
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 30;
      width: 100%;
      max-width: 480px;
      transform: translateX(-50%);
      display: flex;
      border-top: 1px solid var(--border);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(14px);
      padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 30px -24px rgba(20, 20, 30, .45);
    }

    .bottom-nav button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 7px 0 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--faint);
      font-size: 10.5px;
      font-weight: 800;
    }

    .nav-icon {
      font-size: 19px;
      line-height: 1;
      font-weight: 700;
    }

    .bottom-nav button.active {
      color: var(--accent);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(82px + env(safe-area-inset-bottom));
      z-index: 50;
      transform: translateX(-50%);
      max-width: min(420px, calc(100% - 32px));
      padding: 10px 14px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--text) 92%, transparent);
      color: var(--surface);
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, -6px);
    }

    .small {
      font-size: 12px;
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 380px) {
      .task-row {
        grid-template-columns: 18px 88px minmax(0, 1fr) 26px;
        gap: 5px;
      }

      .hours-control {
        grid-template-columns: 23px 40px 23px;
      }

      .account-pill {
        max-width: 128px;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="phone" id="app">
      <header class="topbar">
        <div class="title">
          <h1>日報ジェネレーター</h1>
          <div class="date-label" id="dateLabel"></div>
        </div>
        <div class="account-pill" id="accountPill">
          <div class="avatar" id="accountAvatar">G</div>
          <span id="accountName">未ログイン</span>
        </div>
      </header>

      <section class="subbar" id="subbar"></section>

      <section class="content">
        <div class="screen active" id="reportScreen"></div>
        <div class="screen" id="tacosScreen"></div>
        <div class="screen" id="settingsScreen"></div>
      </section>

      <nav class="bottom-nav" aria-label="画面切り替え">
        <button type="button" data-tab="report" class="active">
          <span class="nav-icon" aria-hidden="true">▤</span>
          <span>日報</span>
        </button>
        <button type="button" data-tab="tacos">
          <span class="nav-icon" aria-hidden="true">▥</span>
          <span>タコス</span>
        </button>
        <button type="button" data-tab="settings">
          <span class="nav-icon" aria-hidden="true">☷</span>
          <span>設定</span>
        </button>
      </nav>
    </main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = 'daily_report_state_v5';
    const WEBHOOK_KEY = 'webhook_url';
    const THEME_KEY = 'theme';
    const WD = ['日', '月', '火', '水', '木', '金', '土'];
    const ACCENTS = {
      blue: '#3a6fd0',
      green: '#1f9d64',
      rose: '#cf5d73',
      amber: '#c47b24',
      teal: '#168a8f',
      violet: '#7c68c7',
    };

    const firebaseConfig = {
      apiKey: 'AIzaSyCbDNiAiSzy56-ExT3NWqsYVfCHiY9DudI',
      authDomain: 'nippo-generator.firebaseapp.com',
      projectId: 'nippo-generator',
      storageBucket: 'nippo-generator.firebasestorage.app',
      messagingSenderId: '69447370081',
      appId: '1:69447370081:web:44ac06a844072b7fac7120',
    };

    let auth = null;
    let db = null;
    let currentUser = null;
    let uidSeed = Date.now();
    let saveTimer = null;
    let saving = false;
    let saveQueued = false;
    let firebaseRetry = null;

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const id = () => 'id' + (++uidSeed).toString(36);

    const state = defaultState();

    function defaultState() {
      return {
        tab: 'report',
        reportMode: 'taikin',
        theme: localStorage.getItem(THEME_KEY) || 'light',
        accentColor: 'blue',
        reportWork: {
          greeting: 'お疲れ様です。退勤いたします。\n本日の作業内容です。',
          taikinGroups: [
            makeGroup('A案件', [makeTask('', 0.5)]),
            makeGroup('その他', [makeTask('朝会・夕会等', 0.5)]),
          ],
          morningGroups: [
            makeGroup('A案件', [makeTask('', 0.5)]),
            makeGroup('その他', [makeTask('朝会・夕会等', 0.5)]),
          ],
        },
        reportPresets: ['朝会・夕会等', 'MTG', '設計'],
        tacoMode: 'merge',
        tacoBlocks: [makeTacoBlock()],
        tacoContacts: [],
        tacoTemplates: [
          { id: id(), label: '感謝', body: 'いつもありがとうございます！' },
          { id: id(), label: 'レビュー', body: 'レビューありがとうございました。' },
          { id: id(), label: 'ヘルプ', body: 'サポートありがとうございました！' },
        ],
        tacoUsage: { date: todayKey(), consumed: 0, dailyLimit: 5 },
        webhookUrl: localStorage.getItem(WEBHOOK_KEY) || '',
        ui: {
          greetingOpen: false,
          outputOpen: true,
          tacoOutputOpen: true,
          contactsOpen: false,
        },
      };
    }

    function makeTask(name = '', hours = 0.5) {
      return { id: id(), name, hours };
    }

    function makeGroup(category = '新規案件', tasks = [makeTask()]) {
      return { id: id(), category, tasks };
    }

    function makeTacoBlock() {
      return { id: id(), recipients: [], count: 1, body: '' };
    }

    function todayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadLocal() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      } catch {
        return null;
      }
    }

    function applyStoredData(data) {
      if (!data || typeof data !== 'object') return;
      if (data.reportWork) {
        state.reportWork.greeting = String(data.reportWork.greeting || state.reportWork.greeting);
        if (Array.isArray(data.reportWork.taikinGroups)) state.reportWork.taikinGroups = cleanGroups(data.reportWork.taikinGroups);
        if (Array.isArray(data.reportWork.morningGroups)) state.reportWork.morningGroups = cleanGroups(data.reportWork.morningGroups);
      }
      if (Array.isArray(data.reportPresets)) state.reportPresets = data.reportPresets.filter(Boolean);
      if (Array.isArray(data.tacoContacts)) {
        state.tacoContacts = data.tacoContacts
          .map((c) => ({ id: c.id || id(), name: String(c.name || '').trim(), slackUserId: c.slackUserId || null, sendCount: Number(c.sendCount || c.freq || 0) }))
          .filter((c) => c.name);
      }
      if (Array.isArray(data.tacoTemplates)) {
        state.tacoTemplates = data.tacoTemplates
          .map((t) => ({ id: t.id || id(), label: String(t.label || '').trim(), body: String(t.body || '').trim() }))
          .filter((t) => t.label && t.body);
      }
      if (Array.isArray(data.tacoBlocks)) state.tacoBlocks = cleanTacoBlocks(data.tacoBlocks);
      if (data.tacoUsage || data.usage) state.tacoUsage = normalizeUsage(data.tacoUsage || data.usage);
      if (data.webhookUrl || data.webhook) state.webhookUrl = data.webhookUrl || data.webhook;
      if (data.theme) state.theme = data.theme;
      if (data.accentColor) state.accentColor = data.accentColor;
      if (data.tacoMode === 'merge' || data.tacoMode === 'split') state.tacoMode = data.tacoMode;
    }

    function cleanGroups(groups) {
      const cleaned = groups.map((g) => ({
        id: g.id || id(),
        category: String(g.category || '新規案件'),
        tasks: Array.isArray(g.tasks) ? g.tasks.map((t) => ({
          id: t.id || id(),
          name: String(t.name || ''),
          hours: normalizeHours(t.hours),
        })) : [makeTask()],
      }));
      return cleaned.length ? cleaned : [makeGroup()];
    }

    function cleanTacoBlocks(blocks) {
      const cleaned = blocks.map((b) => ({
        id: b.id || id(),
        recipients: Array.isArray(b.recipients) ? b.recipients.map(String).filter(Boolean) : [],
        count: Math.max(1, Math.min(9, Number(b.count || 1))),
        body: String(b.body || ''),
      }));
      return cleaned.length ? cleaned : [makeTacoBlock()];
    }

    function normalizeHours(value) {
      return Math.max(0, Math.round((parseFloat(value) || 0) * 2) / 2);
    }

    function normalizeUsage(usage) {
      const date = todayKey();
      const current = usage && typeof usage === 'object' ? usage : {};
      return {
        date,
        consumed: current.date === date ? Math.max(0, Number(current.consumed || 0)) : 0,
        dailyLimit: Math.max(1, Number(current.dailyLimit || 5)),
      };
    }

    function serializableState() {
      return {
        reportWork: state.reportWork,
        reportPresets: state.reportPresets,
        tacoContacts: state.tacoContacts,
        tacoTemplates: state.tacoTemplates,
        tacoBlocks: state.tacoBlocks,
        tacoUsage: normalizeUsage(state.tacoUsage),
        tacoMode: state.tacoMode,
        webhookUrl: state.webhookUrl,
        theme: state.theme,
        accentColor: state.accentColor,
      };
    }

    function persistLocal() {
      const data = serializableState();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      localStorage.setItem(WEBHOOK_KEY, data.webhookUrl || '');
      localStorage.setItem(THEME_KEY, data.theme || 'light');
    }

    function persist(immediate = false) {
      persistLocal();
      if (immediate) saveToFirestore();
      else debouncedFirestoreSave();
    }

    function firebaseReady() {
      return !!(window.firebase && firebase.initializeApp && firebase.auth && firebase.firestore);
    }

    function initFirebase() {
      if (auth) return;
      if (!firebaseReady()) {
        clearTimeout(firebaseRetry);
        firebaseRetry = setTimeout(initFirebase, 300);
        return;
      }
      if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
      auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        renderAccount();
        if (user) await loadFromFirestore();
        render();
      });
    }

    function userDocRef() {
      if (!currentUser || !db) return null;
      return db.collection('users').doc(currentUser.uid);
    }

    async function googleLogin() {
      initFirebase();
      if (!auth) {
        showToast('ログイン機能を読み込めませんでした');
        return;
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        await auth.signInWithPopup(provider);
      } catch (error) {
        showToast('ログインできませんでした');
        console.error(error);
      }
    }

    async function googleLogout() {
      if (!auth) return;
      await auth.signOut();
      currentUser = null;
      render();
    }

    async function loadFromFirestore() {
      const ref = userDocRef();
      if (!ref) return;
      try {
        const snap = await ref.get();
        if (snap.exists) {
          applyStoredData(snap.data());
          persistLocal();
        } else {
          await saveToFirestore();
        }
      } catch (error) {
        showToast('同期データを読み込めませんでした');
        console.error(error);
      }
    }

    async function saveToFirestore() {
      const ref = userDocRef();
      if (!ref) return;
      if (saving) {
        saveQueued = true;
        return;
      }
      saving = true;
      try {
        await ref.set({
          ...serializableState(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        }, { merge: true });
      } catch (error) {
        showToast('同期に失敗しました。入力内容はこの端末に保存されています');
        console.error(error);
      }
      saving = false;
      if (saveQueued) {
        saveQueued = false;
        await saveToFirestore();
      }
    }

    function debouncedFirestoreSave() {
      if (!currentUser) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveToFirestore, 1500);
    }

    async function postToSlack(text) {
      if (!state.webhookUrl) throw new Error('Webhook is empty');
      await fetch(state.webhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'payload=' + encodeURIComponent(JSON.stringify({ text })),
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function setTab(tab) {
      state.tab = tab;
      render();
    }

    function setReportMode(mode) {
      state.reportMode = mode;
      render();
    }

    function activeGroups() {
      return state.reportMode === 'taikin' ? state.reportWork.taikinGroups : state.reportWork.morningGroups;
    }

    function setActiveGroups(groups) {
      if (state.reportMode === 'taikin') state.reportWork.taikinGroups = groups;
      else state.reportWork.morningGroups = groups;
    }

    function formatHours(hours) {
      return (Number(hours) || 0).toFixed(1);
    }

    function formatDay(groups) {
      return groups
        .filter((group) => group.tasks.some((task) => task.name.trim() && Number(task.hours) > 0))
        .map((group) => {
          const lines = group.tasks
            .filter((task) => task.name.trim() && Number(task.hours) > 0)
            .map((task) => `${formatHours(task.hours)}h｜${task.name.trim()}`);
          return `＜${group.category.trim() || '案件'}＞\n${lines.join('\n')}`;
        })
        .join('\n');
    }

    function reportOutputs() {
      const todayBody = formatDay(state.reportWork.taikinGroups);
      const tomorrowBody = formatDay(state.reportWork.morningGroups);
      const greeting = state.reportWork.greeting.trim();
      const block1 = `${greeting ? greeting + '\n\n' : ''}${todayBody || '（退勤報告が未入力です）'}`;
      const block2 = todayBody || '（退勤報告が未入力です）';
      const block3 = tomorrowBody || '（朝会報告が未入力です）';
      return [
        { title: '退勤報告', text: block1 },
        { title: '今日やったこと', text: block2 },
        { title: '明日やること', text: block3 },
      ];
    }

    async function copyText(text, message, afterCopy) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement('textarea');
        area.value = text;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
      }
      if (afterCopy) afterCopy();
      showToast(message);
      persistLocal();
    }

    function showToast(message) {
      const toast = $('#toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    function totalHours(groups) {
      return groups.reduce((sum, group) => sum + group.tasks.reduce((inner, task) => inner + (task.name.trim() ? Number(task.hours) || 0 : 0), 0), 0);
    }

    function moveItem(list, index, delta) {
      const to = index + delta;
      if (to < 0 || to >= list.length) return list;
      const next = list.slice();
      const [item] = next.splice(index, 1);
      next.splice(to, 0, item);
      return next;
    }

    function updateReportGroup(groupId, updater) {
      const groups = activeGroups().map((group) => group.id === groupId ? updater(clone(group)) : group);
      setActiveGroups(groups);
      persist();
      render();
    }

    function tacoPosts() {
      const valid = state.tacoBlocks
        .map((block) => ({ ...block, body: block.body.trim(), count: Math.max(1, Number(block.count) || 1), recipients: block.recipients.filter(Boolean) }))
        .filter((block) => block.recipients.length && block.body);

      if (state.tacoMode === 'split') {
        let num = 0;
        return valid.flatMap((block) => block.recipients.map((recipient) => ({
          num: ++num,
          count: block.count,
          people: 1,
          recipients: [recipient],
          consume: block.count,
          text: `＠${recipient}\n${block.body}\n${'🌮'.repeat(block.count)}`,
        })));
      }

      const grouped = new Map();
      valid.forEach((block) => {
        if (!grouped.has(block.count)) grouped.set(block.count, []);
        grouped.get(block.count).push(block);
      });
      return Array.from(grouped.keys()).sort((a, b) => b - a).map((count, index) => {
        const blocks = grouped.get(count);
        const text = `${blocks.map((block) => `${block.recipients.map((recipient) => `＠${recipient}`).join(' ')}\n${block.body}`).join('\n\n')}\n${'🌮'.repeat(count)}`;
        const recipients = blocks.flatMap((block) => block.recipients);
        return {
          num: index + 1,
          count,
          people: recipients.length,
          recipients,
          consume: recipients.length * count,
          text,
        };
      });
    }

    function addTacoUsage(posts) {
      const usage = normalizeUsage(state.tacoUsage);
      const total = posts.reduce((sum, post) => sum + post.consume, 0);
      state.tacoUsage = { ...usage, consumed: usage.consumed + total };
      state.tacoContacts = state.tacoContacts.map((contact) => {
        const sendCount = posts.reduce((sum, post) => sum + post.recipients.filter((recipient) => recipient === contact.name).length, 0);
        return sendCount ? { ...contact, sendCount: (contact.sendCount || 0) + sendCount } : contact;
      });
      persist(true);
      render();
    }

    function render() {
      state.tacoUsage = normalizeUsage(state.tacoUsage);
      applyTheme();
      renderHeader();
      renderSubbar();
      renderReport();
      renderTacos();
      renderSettings();
      $$('.screen').forEach((screen) => screen.classList.remove('active'));
      $(`#${state.tab}Screen`).classList.add('active');
      $$('.bottom-nav button').forEach((button) => button.classList.toggle('active', button.dataset.tab === state.tab));
    }

    function applyTheme() {
      document.body.classList.toggle('theme-dark', state.theme === 'dark');
      document.documentElement.style.setProperty('--accent', ACCENTS[state.accentColor] || ACCENTS.blue);
    }

    function renderHeader() {
      const d = new Date();
      $('#dateLabel').textContent = `${d.getMonth() + 1}月${d.getDate()}日 (${WD[d.getDay()]})`;
      renderAccount();
    }

    function renderAccount() {
      const avatar = $('#accountAvatar');
      const name = currentUser ? (currentUser.displayName || currentUser.email || 'ログイン中') : '未ログイン';
      $('#accountName').textContent = name;
      avatar.innerHTML = '';
      if (currentUser && currentUser.photoURL) {
        const img = document.createElement('img');
        img.src = currentUser.photoURL;
        img.alt = '';
        avatar.appendChild(img);
      } else {
        avatar.textContent = (name || 'G').slice(0, 1);
      }
    }

    function renderSubbar() {
      const subbar = $('#subbar');
      if (state.tab === 'report') {
        const outputs = reportOutputs();
        const quick = state.reportMode === 'taikin' ? outputs[0] : outputs[2];
        subbar.innerHTML = `
          <div class="segmented">
            <button type="button" class="${state.reportMode === 'taikin' ? 'active' : ''}" data-action="report-mode" data-mode="taikin">退勤報告</button>
            <button type="button" class="${state.reportMode === 'morning' ? 'active' : ''}" data-action="report-mode" data-mode="morning">朝会報告</button>
          </div>
          <button type="button" class="quick-copy" data-action="quick-copy">${state.reportMode === 'taikin' ? '退勤報告をコピー' : '朝会報告をコピー'}</button>
        `;
        $('[data-action="quick-copy"]', subbar).addEventListener('click', () => copyText(quick.text, `${quick.title}をコピーしました`));
      } else if (state.tab === 'tacos') {
        const usage = normalizeUsage(state.tacoUsage);
        const pct = Math.min(100, usage.dailyLimit ? usage.consumed / usage.dailyLimit * 100 : 0);
        subbar.innerHTML = `
          <div class="taco-meter ${usage.consumed > usage.dailyLimit ? 'meter-over' : ''}" style="--meter:${pct}%">
            <div class="meter-row">
              <span>本日の消費${usage.consumed > usage.dailyLimit ? ' / 上限超過' : ''}</span>
              <span>${usage.consumed} / ${usage.dailyLimit}</span>
            </div>
            <div class="meter-track"><div class="meter-fill"></div></div>
          </div>
        `;
      } else {
        subbar.innerHTML = '<div class="small">設定</div>';
      }
    }

    function renderReport() {
      const screen = $('#reportScreen');
      const groups = activeGroups();
      const modeLabel = state.reportMode === 'taikin' ? '退勤報告' : '朝会報告';
      const outputs = reportOutputs();
      screen.innerHTML = `
        <div class="section-title">
          <span>${modeLabel}の作業内容</span>
          <span>計 ${formatHours(totalHours(groups))}h</span>
        </div>
        ${state.reportMode === 'taikin' ? renderGreetingCard() : ''}
        <div id="groupList"></div>
        <button type="button" class="secondary add-group-button" data-action="add-group">案件カテゴリを追加</button>
        ${renderReportOutput(outputs)}
      `;

      const list = $('#groupList', screen);
      groups.forEach((group, groupIndex) => {
        const card = document.createElement('div');
        card.className = 'card category-card';
        card.innerHTML = `
          <div class="handle-stack">
            <button type="button" class="handle-button" data-action="move-group" data-index="${groupIndex}" data-delta="-1">↑</button>
            <button type="button" class="handle-button" data-action="move-group" data-index="${groupIndex}" data-delta="1">↓</button>
          </div>
          <div class="category-main">
            <div class="category-head">
              <input class="category-input" value="${escapeHtml(group.category)}" data-action="category" data-group="${group.id}" aria-label="案件カテゴリ">
              <span class="small">${formatHours(totalHours([group]))}h</span>
              <button type="button" class="icon-button" data-action="delete-group" data-group="${group.id}">×</button>
            </div>
            <div class="preset-row">
              <span class="add-label">追加:</span>
              <div class="chip-row">${state.reportPresets.map((preset) => `<button type="button" class="chip" data-action="preset" data-group="${group.id}" data-preset="${escapeHtml(preset)}">＋ ${escapeHtml(preset)}</button>`).join('')}</div>
            </div>
            <div class="task-list">
              ${group.tasks.map((task, taskIndex) => renderTaskRow(group.id, task, taskIndex)).join('')}
            </div>
            <button type="button" class="secondary" data-action="add-task" data-group="${group.id}">空のタスク</button>
          </div>
        `;
        list.appendChild(card);
      });

      bindReportEvents(screen);
    }

    function renderGreetingCard() {
      return `
        <div class="card">
          <div class="card-body">
            <button type="button" class="secondary greeting-button" data-action="toggle-greeting">挨拶文</button>
            <div class="${state.ui.greetingOpen ? '' : 'hidden'}" style="margin-top:10px;">
              <textarea rows="3" style="width:100%;" data-action="greeting">${escapeHtml(state.reportWork.greeting)}</textarea>
            </div>
          </div>
        </div>
      `;
    }

    function renderTaskRow(groupId, task, taskIndex) {
      return `
        <div class="task-row">
          <div class="handle-stack">
            <button type="button" class="handle-button" data-action="move-task" data-group="${groupId}" data-index="${taskIndex}" data-delta="-1">↑</button>
            <button type="button" class="handle-button" data-action="move-task" data-group="${groupId}" data-index="${taskIndex}" data-delta="1">↓</button>
          </div>
          <div class="hours-control">
            <button type="button" class="mini-button" data-action="bump-hours" data-group="${groupId}" data-task="${task.id}" data-delta="-0.5">−</button>
            <input type="number" step="0.5" min="0" value="${formatHours(task.hours)}" data-action="task-hours" data-group="${groupId}" data-task="${task.id}" aria-label="作業時間">
            <button type="button" class="mini-button" data-action="bump-hours" data-group="${groupId}" data-task="${task.id}" data-delta="0.5">＋</button>
          </div>
          <input value="${escapeHtml(task.name)}" data-action="task-name" data-group="${groupId}" data-task="${task.id}" placeholder="タスク名">
          <button type="button" class="icon-button" data-action="delete-task" data-group="${groupId}" data-task="${task.id}">×</button>
        </div>
      `;
    }

    function renderReportOutput(outputs) {
      return `
        <div class="card">
          <div class="card-body">
            <button type="button" class="secondary" style="width:100%;" data-action="toggle-output">出力プレビュー</button>
            <div class="${state.ui.outputOpen ? '' : 'hidden'}" style="display:grid; gap:10px; margin-top:11px;">
              ${outputs.map((block, index) => `
                <div class="card">
                  <div class="output-head">
                    <span>${index + 1}. ${block.title}</span>
                    <button type="button" class="chip" data-action="copy-output" data-index="${index}">コピー</button>
                  </div>
                  <pre class="output">${escapeHtml(block.text)}</pre>
                </div>
              `).join('')}
            </div>
            <div class="button-row" style="margin-top:13px;">
              <button type="button" class="primary" data-action="copy-all-report">3つまとめてコピー</button>
              <button type="button" class="secondary" data-action="send-slack">Slack送信</button>
            </div>
          </div>
        </div>
      `;
    }

    function bindReportEvents(root) {
      $('[data-action="add-group"]', root).addEventListener('click', () => {
        setActiveGroups([...activeGroups(), makeGroup()]);
        persist();
        render();
      });

      $$('[data-action="category"]', root).forEach((input) => {
        input.addEventListener('change', () => updateReportGroup(input.dataset.group, (group) => ({ ...group, category: input.value })));
      });

      $$('[data-action="delete-group"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          const next = activeGroups().filter((group) => group.id !== button.dataset.group);
          setActiveGroups(next.length ? next : [makeGroup()]);
          persist();
          render();
        });
      });

      $$('[data-action="move-group"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          setActiveGroups(moveItem(activeGroups(), Number(button.dataset.index), Number(button.dataset.delta)));
          persist();
          render();
        });
      });

      $$('[data-action="preset"]', root).forEach((button) => {
        button.addEventListener('click', () => updateReportGroup(button.dataset.group, (group) => ({ ...group, tasks: [...group.tasks, makeTask(button.dataset.preset, 0.5)] })));
      });

      $$('[data-action="add-task"]', root).forEach((button) => {
        button.addEventListener('click', () => updateReportGroup(button.dataset.group, (group) => ({ ...group, tasks: [...group.tasks, makeTask()] })));
      });

      $$('[data-action="task-name"]', root).forEach((input) => {
        input.addEventListener('change', () => updateReportGroup(input.dataset.group, (group) => ({
          ...group,
          tasks: group.tasks.map((task) => task.id === input.dataset.task ? { ...task, name: input.value } : task),
        })));
      });

      $$('[data-action="task-hours"]', root).forEach((input) => {
        input.addEventListener('change', () => updateReportGroup(input.dataset.group, (group) => ({
          ...group,
          tasks: group.tasks.map((task) => task.id === input.dataset.task ? { ...task, hours: normalizeHours(input.value) } : task),
        })));
      });

      $$('[data-action="bump-hours"]', root).forEach((button) => {
        button.addEventListener('click', () => updateReportGroup(button.dataset.group, (group) => ({
          ...group,
          tasks: group.tasks.map((task) => task.id === button.dataset.task ? { ...task, hours: normalizeHours(Number(task.hours) + Number(button.dataset.delta)) } : task),
        })));
      });

      $$('[data-action="delete-task"]', root).forEach((button) => {
        button.addEventListener('click', () => updateReportGroup(button.dataset.group, (group) => {
          const tasks = group.tasks.filter((task) => task.id !== button.dataset.task);
          return { ...group, tasks: tasks.length ? tasks : [makeTask()] };
        }));
      });

      $$('[data-action="move-task"]', root).forEach((button) => {
        button.addEventListener('click', () => updateReportGroup(button.dataset.group, (group) => ({ ...group, tasks: moveItem(group.tasks, Number(button.dataset.index), Number(button.dataset.delta)) })));
      });

      const greeting = $('[data-action="greeting"]', root);
      if (greeting) greeting.addEventListener('change', () => {
        state.reportWork.greeting = greeting.value;
        persist();
        render();
      });

      const toggleGreeting = $('[data-action="toggle-greeting"]', root);
      if (toggleGreeting) toggleGreeting.addEventListener('click', () => {
        state.ui.greetingOpen = !state.ui.greetingOpen;
        render();
      });

      $('[data-action="toggle-output"]', root).addEventListener('click', () => {
        state.ui.outputOpen = !state.ui.outputOpen;
        render();
      });

      $$('[data-action="copy-output"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          const block = reportOutputs()[Number(button.dataset.index)];
          copyText(block.text, `${block.title}をコピーしました`);
        });
      });

      $('[data-action="copy-all-report"]', root).addEventListener('click', () => {
        copyText(reportOutputs().map((block) => block.text).join('\n\n'), '3まとまりをコピーしました');
      });

      $('[data-action="send-slack"]', root).addEventListener('click', async () => {
        if (!state.webhookUrl) {
          state.tab = 'settings';
          render();
          showToast('Slack送信先を設定してください');
          return;
        }
        try {
          for (const block of reportOutputs()) await postToSlack(block.text);
          showToast('Slackへ送信しました');
        } catch (error) {
          showToast('Slackへ送信できませんでした');
          console.error(error);
        }
      });
    }

    function renderTacos() {
      const screen = $('#tacosScreen');
      const posts = tacoPosts();
      const sortedContacts = state.tacoContacts.slice().sort((a, b) => (b.sendCount || 0) - (a.sendCount || 0));
      screen.innerHTML = `
        <div class="segmented">
          <button type="button" class="${state.tacoMode === 'merge' ? 'active' : ''}" data-action="taco-mode" data-mode="merge">投稿をまとめる</button>
          <button type="button" class="${state.tacoMode === 'split' ? 'active' : ''}" data-action="taco-mode" data-mode="split">個別で送る</button>
        </div>
        <div id="tacoBlocks"></div>
        <button type="button" class="secondary" data-action="add-taco-block">投稿ブロックを追加</button>
        <div class="card">
          <div class="card-body">
            <button type="button" class="secondary" style="width:100%;" data-action="toggle-taco-output">出力プレビュー</button>
            <div id="tacoPosts" class="${state.ui.tacoOutputOpen ? '' : 'hidden'}" style="display:grid; gap:10px; margin-top:11px;"></div>
            <button type="button" class="primary" style="width:100%; margin-top:13px;" data-action="copy-all-tacos" ${posts.length ? '' : 'disabled'}>全投稿をまとめてコピー</button>
          </div>
        </div>
      `;

      const blockRoot = $('#tacoBlocks', screen);
      state.tacoBlocks.forEach((block, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-body inline-form">
            <div class="section-title" style="padding:0;">
              <span>ブロック ${index + 1}</span>
              <button type="button" class="chip" data-action="remove-taco-block" data-block="${block.id}">削除</button>
            </div>
            <div class="contact-tags">
              ${block.recipients.map((recipient) => `<span class="contact-tag">${escapeHtml(recipient)}<button type="button" data-action="remove-recipient" data-block="${block.id}" data-recipient="${escapeHtml(recipient)}">×</button></span>`).join('')}
            </div>
            <select data-action="add-recipient" data-block="${block.id}">
              <option value="">宛先を追加</option>
              ${sortedContacts.filter((contact) => !block.recipients.includes(contact.name)).map((contact) => `<option value="${escapeHtml(contact.name)}">${escapeHtml(contact.name)}（${contact.sendCount || 0}回）</option>`).join('')}
            </select>
            <div class="two-col">
              <input type="number" min="1" max="9" value="${block.count}" data-action="taco-count" data-block="${block.id}" aria-label="タコス個数">
              <select data-action="template" data-block="${block.id}">
                <option value="">テンプレート</option>
                ${state.tacoTemplates.map((template) => `<option value="${escapeHtml(template.body)}">${escapeHtml(template.label)}</option>`).join('')}
              </select>
            </div>
            <textarea rows="3" data-action="taco-body" data-block="${block.id}" placeholder="文面">${escapeHtml(block.body)}</textarea>
          </div>
        `;
        blockRoot.appendChild(card);
      });

      const postRoot = $('#tacoPosts', screen);
      postRoot.innerHTML = posts.length ? posts.map((post) => `
        <div class="card">
          <div class="output-head">
            <span>投稿 ${post.num} / 消費 ${post.people}人 × ${post.count}個 = ${post.consume}個</span>
            <button type="button" class="chip" data-action="copy-taco-post" data-index="${post.num - 1}">コピー</button>
          </div>
          <pre class="output">${escapeHtml(post.text)}</pre>
        </div>
      `).join('') : '<div class="small">宛先と文面を入れるとプレビューが表示されます。</div>';

      bindTacoEvents(screen);
    }

    function bindTacoEvents(root) {
      $$('[data-action="taco-mode"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          state.tacoMode = button.dataset.mode;
          persist();
          render();
        });
      });

      $('[data-action="add-taco-block"]', root).addEventListener('click', () => {
        state.tacoBlocks.push(makeTacoBlock());
        persist();
        render();
      });

      $$('[data-action="remove-taco-block"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          state.tacoBlocks = state.tacoBlocks.filter((block) => block.id !== button.dataset.block);
          if (!state.tacoBlocks.length) state.tacoBlocks = [makeTacoBlock()];
          persist();
          render();
        });
      });

      $$('[data-action="add-recipient"]', root).forEach((select) => {
        select.addEventListener('change', () => {
          if (!select.value) return;
          state.tacoBlocks = state.tacoBlocks.map((block) => block.id === select.dataset.block && !block.recipients.includes(select.value) ? { ...block, recipients: [...block.recipients, select.value] } : block);
          persist();
          render();
        });
      });

      $$('[data-action="remove-recipient"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          state.tacoBlocks = state.tacoBlocks.map((block) => block.id === button.dataset.block ? { ...block, recipients: block.recipients.filter((recipient) => recipient !== button.dataset.recipient) } : block);
          persist();
          render();
        });
      });

      $$('[data-action="taco-count"]', root).forEach((input) => {
        input.addEventListener('change', () => {
          state.tacoBlocks = state.tacoBlocks.map((block) => block.id === input.dataset.block ? { ...block, count: Math.max(1, Math.min(9, Number(input.value || 1))) } : block);
          persist();
          render();
        });
      });

      $$('[data-action="template"]', root).forEach((select) => {
        select.addEventListener('change', () => {
          if (!select.value) return;
          state.tacoBlocks = state.tacoBlocks.map((block) => block.id === select.dataset.block ? { ...block, body: select.value } : block);
          persist();
          render();
        });
      });

      $$('[data-action="taco-body"]', root).forEach((textarea) => {
        textarea.addEventListener('change', () => {
          state.tacoBlocks = state.tacoBlocks.map((block) => block.id === textarea.dataset.block ? { ...block, body: textarea.value } : block);
          persist();
          render();
        });
      });

      $('[data-action="toggle-taco-output"]', root).addEventListener('click', () => {
        state.ui.tacoOutputOpen = !state.ui.tacoOutputOpen;
        render();
      });

      $$('[data-action="copy-taco-post"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          const post = tacoPosts()[Number(button.dataset.index)];
          copyText(post.text, `投稿${post.num}をコピーしました`, () => addTacoUsage([post]));
        });
      });

      $('[data-action="copy-all-tacos"]', root).addEventListener('click', () => {
        const posts = tacoPosts();
        if (!posts.length) return;
        copyText(posts.map((post) => post.text).join('\n\n'), `全${posts.length}投稿をコピーしました`, () => addTacoUsage(posts));
      });
    }

    function renderSettings() {
      const screen = $('#settingsScreen');
      screen.innerHTML = `
        <div class="card">
          <div class="card-body settings-row">
            <div class="section-title" style="padding:0;"><span>Googleログイン</span></div>
            <div class="small">ログインすると、このブラウザの入力内容を本人のデータ領域に同期します。</div>
            <div class="button-row">
              <button type="button" class="primary" data-action="login">ログイン</button>
              <button type="button" class="secondary" data-action="logout">ログアウト</button>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body settings-row">
            <div class="section-title" style="padding:0;"><span>Slack連携</span></div>
            <input value="${escapeHtml(state.webhookUrl)}" data-action="webhook" placeholder="https://hooks.slack.com/services/...">
            <div class="small">Webhook URLはこのブラウザとログイン中の本人データ領域に保存されます。</div>
          </div>
        </div>
        <div class="card">
          <div class="card-body settings-row">
            <div class="section-title" style="padding:0;"><span>表示</span></div>
            <div class="segmented">
              <button type="button" class="${state.theme === 'light' ? 'active' : ''}" data-action="theme" data-theme="light">ライト</button>
              <button type="button" class="${state.theme === 'dark' ? 'active' : ''}" data-action="theme" data-theme="dark">ダーク</button>
            </div>
            <div class="accent-grid">
              ${Object.entries(ACCENTS).map(([key, color]) => `<button type="button" class="swatch ${state.accentColor === key ? 'active' : ''}" data-action="accent" data-accent="${key}" style="background:${color};" aria-label="${key}"></button>`).join('')}
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body settings-row">
            <div class="section-title" style="padding:0;"><span>タコス送信相手</span><span>${state.tacoContacts.length}人</span></div>
            <textarea rows="5" data-action="bulk-contacts" placeholder="田中\n佐藤\n鈴木"></textarea>
            <button type="button" class="primary" data-action="import-contacts">一括登録</button>
            <div class="chip-row">${state.tacoContacts.map((contact) => `<span class="contact-tag">${escapeHtml(contact.name)}<button type="button" data-action="delete-contact" data-contact="${contact.id}">×</button></span>`).join('')}</div>
          </div>
        </div>
        <div class="card">
          <div class="card-body settings-row">
            <div class="section-title" style="padding:0;"><span>日報プリセット</span></div>
            <div class="chip-row">${state.reportPresets.map((preset) => `<span class="contact-tag">${escapeHtml(preset)}<button type="button" data-action="delete-preset" data-preset="${escapeHtml(preset)}">×</button></span>`).join('')}</div>
            <div class="button-row">
              <input data-action="new-preset" placeholder="作業名">
              <button type="button" class="primary" data-action="add-preset">追加</button>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body settings-row">
            <div class="section-title" style="padding:0;"><span>タコステンプレート</span></div>
            <div class="chip-row">${state.tacoTemplates.map((template) => `<span class="contact-tag">${escapeHtml(template.label)}<button type="button" data-action="delete-template" data-template="${template.id}">×</button></span>`).join('')}</div>
            <input data-action="new-template-label" placeholder="ラベル">
            <textarea rows="3" data-action="new-template-body" placeholder="文面"></textarea>
            <button type="button" class="primary" data-action="add-template">テンプレートを追加</button>
          </div>
        </div>
        <div class="card">
          <div class="card-body settings-row">
            <div class="section-title" style="padding:0;"><span>本日のタコス消費</span></div>
            <div class="two-col">
              <input type="number" min="0" value="${normalizeUsage(state.tacoUsage).consumed}" data-action="usage-consumed" aria-label="消費数">
              <input type="number" min="1" value="${normalizeUsage(state.tacoUsage).dailyLimit}" data-action="usage-limit" aria-label="上限">
            </div>
          </div>
        </div>
      `;
      bindSettingsEvents(screen);
    }

    function bindSettingsEvents(root) {
      $('[data-action="login"]', root).addEventListener('click', googleLogin);
      $('[data-action="logout"]', root).addEventListener('click', googleLogout);
      $('[data-action="webhook"]', root).addEventListener('change', (event) => {
        state.webhookUrl = event.target.value.trim();
        persist(true);
        showToast('Slack送信先を保存しました');
      });
      $$('[data-action="theme"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          state.theme = button.dataset.theme;
          persist();
          render();
        });
      });
      $$('[data-action="accent"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          state.accentColor = button.dataset.accent;
          persist();
          render();
        });
      });
      $('[data-action="import-contacts"]', root).addEventListener('click', () => {
        const textarea = $('[data-action="bulk-contacts"]', root);
        const names = textarea.value.split('\n').map((name) => name.replace(/^[＠@\s]+/, '').trim()).filter(Boolean);
        const existing = new Set(state.tacoContacts.map((contact) => contact.name));
        let added = 0;
        names.forEach((name) => {
          if (!existing.has(name)) {
            existing.add(name);
            state.tacoContacts.push({ id: id(), name, slackUserId: null, sendCount: 0 });
            added++;
          }
        });
        persist(true);
        render();
        showToast(added ? `${added}人を登録しました` : '新しい相手はありませんでした');
      });
      $$('[data-action="delete-contact"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          const target = state.tacoContacts.find((contact) => contact.id === button.dataset.contact);
          state.tacoContacts = state.tacoContacts.filter((contact) => contact.id !== button.dataset.contact);
          if (target) state.tacoBlocks = state.tacoBlocks.map((block) => ({ ...block, recipients: block.recipients.filter((recipient) => recipient !== target.name) }));
          persist(true);
          render();
        });
      });
      $('[data-action="add-preset"]', root).addEventListener('click', () => {
        const input = $('[data-action="new-preset"]', root);
        const value = input.value.trim();
        if (!value) return;
        if (!state.reportPresets.includes(value)) state.reportPresets.push(value);
        persist(true);
        render();
      });
      $$('[data-action="delete-preset"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          state.reportPresets = state.reportPresets.filter((preset) => preset !== button.dataset.preset);
          persist(true);
          render();
        });
      });
      $('[data-action="add-template"]', root).addEventListener('click', () => {
        const label = $('[data-action="new-template-label"]', root).value.trim();
        const body = $('[data-action="new-template-body"]', root).value.trim();
        if (!label || !body) {
          showToast('ラベルと文面を入力してください');
          return;
        }
        state.tacoTemplates.push({ id: id(), label, body });
        persist(true);
        render();
      });
      $$('[data-action="delete-template"]', root).forEach((button) => {
        button.addEventListener('click', () => {
          state.tacoTemplates = state.tacoTemplates.filter((template) => template.id !== button.dataset.template);
          persist(true);
          render();
        });
      });
      $('[data-action="usage-consumed"]', root).addEventListener('change', (event) => {
        const usage = normalizeUsage(state.tacoUsage);
        state.tacoUsage = { ...usage, consumed: Math.max(0, Number(event.target.value || 0)) };
        persist(true);
        render();
      });
      $('[data-action="usage-limit"]', root).addEventListener('change', (event) => {
        const usage = normalizeUsage(state.tacoUsage);
        state.tacoUsage = { ...usage, dailyLimit: Math.max(1, Number(event.target.value || 5)) };
        persist(true);
        render();
      });
    }

    function boot() {
      applyStoredData(loadLocal());
      render();
      initFirebase();
      $$('.bottom-nav button').forEach((button) => button.addEventListener('click', () => setTab(button.dataset.tab)));
      $('#subbar').addEventListener('click', (event) => {
        const button = event.target.closest('[data-action="report-mode"]');
        if (button) setReportMode(button.dataset.mode);
      });
      window.googleLogin = googleLogin;
      window.googleLogout = googleLogout;
      window.userDocRef = userDocRef;
      window.loadFromFirestore = loadFromFirestore;
      window.saveToFirestore = saveToFirestore;
      window.debouncedFirestoreSave = debouncedFirestoreSave;
      window.postToSlack = postToSlack;
    }

    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
</html>
