<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日報ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* =========================================================================
   日報ジェネレーター — 実装参照用 単一HTML（バニラJS / 描画エンジン不要）
   - テーマは :root のCSS変数で切替（LIGHT / DARK + アクセント6色）
   - 状態は state オブジェクト1つ。App.* のハンドラが state を更新し render() で再描画
   - 認証 / クラウド同期 / Slack送信 は本ファイルではモック（既存資産前提）
   ========================================================================= */

:root{
  --bg:#f3f2ee; --bg2:#e9e7e1; --surface:#fff; --surface2:#faf9f6;
  --text:#21222a; --muted:#71727f; --faint:#9a9ba6;
  --border:#e7e5df; --border2:#efede9;
  --danger:#d0463b; --danger-bg:#fbeae8; --ok:#1f9d64; --taco:#c48200;
  --accent:#3a6fd0;
  --shadow:0 1px 2px rgba(20,20,30,.05),0 10px 30px -18px rgba(20,20,30,.22);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{
  background:var(--bg2); color:var(--text);
  font-family:'Zen Kaku Gothic New',sans-serif; -webkit-font-smoothing:antialiased;
  line-height:1.5; display:flex; justify-content:center; min-height:100vh; min-height:100dvh;
}
textarea,input,button,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
.mono{font-family:'Space Mono',monospace;}
::placeholder{color:var(--faint);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

@keyframes sheetUp{from{transform:translateY(101%);}to{transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}
@keyframes popIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---- 画面シェル ---- */
.app{
  width:100%; max-width:480px; height:100vh; height:100dvh; background:var(--bg);
  border-left:1px solid var(--border); border-right:1px solid var(--border);
  display:block; overflow:hidden; position:relative;
}
.header{
  position:fixed; top:0; left:50%; transform:translateX(-50%); z-index:30;
  width:100%; max-width:480px; min-height:68px;
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border); padding:13px 18px;
  display:flex; align-items:center; gap:11px;
}
.header__title{font-size:16px; font-weight:700; letter-spacing:.01em;}
.header__date{font-size:11.5px; color:var(--muted);}
.account{
  display:flex; align-items:center; gap:8px; padding:4px 10px 4px 4px;
  background:var(--surface); border:1px solid var(--border); border-radius:999px; box-shadow:var(--shadow);
}
.avatar{
  width:30px; height:30px; border-radius:50%;
  background:linear-gradient(135deg,#7c8cf0,#a06cd0);
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:13px;
}
.avatar--lg{width:40px;height:40px;}
.account__badge{
  position:absolute; right:-3px; bottom:-3px; width:15px; height:15px; border-radius:50%;
  background:#fff; border:1.5px solid var(--surface);
  display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.2);
}

.subheader{
  position:fixed; top:68px; left:50%; transform:translateX(-50%); z-index:25;
  width:100%; max-width:480px; background:var(--bg); border-bottom:1px solid var(--border); padding:9px 16px 11px;
}
.scroll{
  position:absolute; left:0; right:0; top:68px; bottom:0;
  overflow-y:auto; overflow-x:hidden; padding:16px 16px calc(88px + env(safe-area-inset-bottom));
}
.app[data-tab="report"] .scroll{top:224px;}
.app[data-tab="tacos"] .scroll{top:166px;}
.app[data-tab="settings"] .scroll{top:68px;}
.tab{display:flex; flex-direction:column; gap:14px;}

/* ---- 共通パーツ ---- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow);}
.seg{display:flex; background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:4px; gap:4px;}
.seg__btn{flex:1; padding:9px; border:none; border-radius:9px; font-size:13.5px; font-weight:700; background:transparent; color:var(--muted); transition:all .15s;}
.seg__btn.is-active{background:var(--surface); color:var(--accent); box-shadow:var(--shadow);}
.btn-primary{
  border:none; background:var(--accent); color:#fff; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.btn-ghost{border:1px solid var(--border); background:var(--surface); color:var(--text); font-weight:700;}
.btn-dashed{
  width:100%; padding:12px; border-radius:13px; border:1px dashed var(--border);
  background:transparent; color:var(--muted); font-weight:700; font-size:13px;
  display:flex; align-items:center; justify-content:center; gap:7px;
}
.section-label{font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.05em; padding:0 4px 9px;}
.icon{display:inline-flex;}

/* ---- 日報: 案件カード ---- */
.cat{overflow:hidden; transition:transform .18s cubic-bezier(.2,.85,.25,1);}
.cat__head{
  display:flex; align-items:center; border-bottom:1px solid var(--border2);
  background:color-mix(in srgb, var(--accent) 5%, var(--surface));
}
.handle{flex:none; width:36px; align-self:stretch; cursor:grab; display:flex; align-items:center; justify-content:center; color:var(--faint); touch-action:none;}
.cat__name-btn{flex:1; min-width:0; display:flex; align-items:center; gap:7px; background:transparent; border:none; padding:9px 4px; text-align:left;}
.cat__name-text{font-size:14.5px; font-weight:700; color:var(--accent); max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cat__name-edit{flex:1; min-width:0; display:flex; align-items:center; background:var(--surface); border:1px solid var(--accent); border-radius:9px; padding:0 4px 0 10px; margin:7px 0; box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent);}
.cat__name-input{flex:1; min-width:0; border:none; background:transparent; padding:8px 0; font-size:14.5px; font-weight:700; color:var(--accent); outline:none;}
.cat__hours{flex:none; font-size:11px; color:var(--faint); margin:0 8px;}
.icon-btn{flex:none; border:none; background:transparent; color:var(--faint); display:flex; align-items:center; justify-content:center;}
.cat__del{width:38px; align-self:stretch;}

.task{display:flex; align-items:center; border-bottom:1px solid var(--border2); transition:transform .18s cubic-bezier(.2,.85,.25,1);}
.dragging{transition:none!important; z-index:100; box-shadow:0 14px 30px -8px rgba(20,20,40,.30),0 4px 10px rgba(20,20,40,.16); position:relative;}
@media (prefers-reduced-motion: reduce){.cat,.task{transition:none;}}
.stepper{flex:none; display:flex; align-items:center; background:var(--surface2); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.stepper__btn{width:21px; height:30px; border:none; background:transparent; color:var(--muted); font-size:15px; font-weight:700;}
.stepper__val{display:flex; align-items:baseline; width:42px; justify-content:center;}
.stepper__input{width:30px; border:none; background:transparent; text-align:center; padding:0; font-weight:700; font-size:13px; outline:none;}
.task__name{flex:1; min-width:0; border:1px solid var(--border); background:var(--surface2); border-radius:8px; padding:8px 10px; margin:6px 8px 6px 0; font-size:14px; font-weight:500; outline:none;}
.task__name:focus{border-color:var(--accent);}
.task__del{width:36px; align-self:stretch;}

.chip{
  display:inline-flex; align-items:center; gap:4px; padding:6px 11px; border-radius:999px;
  border:1px dashed color-mix(in srgb, var(--accent) 40%, var(--border));
  background:color-mix(in srgb, var(--accent) 6%, transparent); color:var(--accent); font-size:12px; font-weight:700;
}
.chip--plain{border:1px solid var(--border); background:var(--surface2); color:var(--muted); border-style:solid; font-weight:600;}

/* ---- 出力プレビュー ---- */
.out{border:1px solid var(--border2); border-radius:12px; overflow:hidden;}
.out__head{display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--surface2); border-bottom:1px solid var(--border2);}
.out__num{width:18px; height:18px; border-radius:6px; background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;}
.out__copy{font-size:11.5px; font-weight:700; color:var(--accent); border:none; background:transparent; display:flex; align-items:center; gap:5px;}
.out__body{margin:0; white-space:pre-wrap; word-break:break-word; font-family:'Zen Kaku Gothic New',sans-serif; font-size:12.5px; line-height:1.75; color:var(--text); padding:11px 13px;}
.collapse-head{width:100%; border:none; background:transparent; padding:0; display:flex; align-items:center; justify-content:space-between; text-align:left;}
.chev{display:flex; transition:transform .2s; color:var(--faint);}

/* ---- タコス ---- */
.meter{flex:none; padding:10px 16px; border-bottom:1px solid var(--border);}
.meter__bar{height:7px; border-radius:99px; background:color-mix(in srgb, var(--text) 9%, transparent); overflow:hidden;}
.meter__fill{height:100%; border-radius:99px; transition:width .25s; background:var(--accent);}
.block{position:relative; background:var(--surface); border:1px solid var(--border); border-radius:15px; box-shadow:var(--shadow); padding:13px;}
.rcpt{display:inline-flex; align-items:center; gap:5px; padding:5px 8px 5px 11px; border-radius:999px; background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); font-size:13px; font-weight:700;}
.count{display:flex; align-items:center; background:var(--surface2); border:1px solid var(--border); border-radius:9px; overflow:hidden;}
.count__btn{width:28px; height:30px; border:none; background:transparent; color:var(--muted); font-size:16px; font-weight:700;}
.count__val{width:36px; text-align:center; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center; gap:1px;}
.select-wrap{position:relative; margin-bottom:9px;}
.select{width:100%; appearance:none; -webkit-appearance:none; border:1px solid var(--border); background:var(--surface2); border-radius:11px; padding:10px 34px 10px 12px; font-size:13px; font-weight:600; color:var(--muted); outline:none; cursor:pointer;}
.select-wrap__chev{position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; color:var(--faint); display:flex;}
.tpl-chip{padding:5px 11px; border-radius:999px; border:1px solid var(--border); background:var(--surface2); color:var(--muted); font-size:11.5px; font-weight:700;}
.tpl-chip.is-active{background:var(--accent); color:#fff; border-color:var(--accent);}
.body-input{width:100%; resize:none; border:1px solid var(--border); background:var(--surface2); border-radius:11px; padding:10px 12px; font-size:13px; line-height:1.55; outline:none;}
.post{border:1px solid var(--border2); border-radius:12px; overflow:hidden;}
.post__head{display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--surface2); border-bottom:1px solid var(--border2);}
.post__badge{font-size:11px; font-weight:700; color:var(--accent); background:color-mix(in srgb,var(--accent) 13%,transparent); padding:3px 8px; border-radius:999px;}
.post__body{padding:11px 13px; font-size:13px; line-height:1.7; word-break:break-word; white-space:pre-wrap;}
.post__meta{padding:0 13px 10px; font-size:11px; color:var(--faint);}

/* ---- 設定 ---- */
.field-input{width:100%; border:1px solid var(--border); background:var(--surface2); border-radius:10px; padding:10px 12px; font-size:13px; outline:none;}
.pill-group{display:flex; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:3px;}
.pill{padding:6px 14px; border-radius:8px; border:none; font-size:12.5px; font-weight:700; background:transparent; color:var(--muted);}
.pill.is-active{background:var(--accent); color:#fff;}
.swatch{width:32px; height:32px; border-radius:50%; border:2px solid transparent;}
.tag{display:inline-flex; align-items:center; gap:6px; padding:7px 9px 7px 12px; border-radius:999px; background:var(--surface2); border:1px solid var(--border); font-size:12.5px; font-weight:600;}
.contact-row{display:flex; align-items:center; gap:10px; padding:9px 11px; border-bottom:1px solid var(--border2);}
.contact-row__ini{width:24px; height:24px; flex:none; border-radius:50%; background:color-mix(in srgb, var(--accent) 13%, transparent); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;}
.tpl-row{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:11px;}
.tpl-row__label{flex:none; font-size:11px; font-weight:700; color:var(--accent); background:color-mix(in srgb,var(--accent) 13%,transparent); padding:3px 9px; border-radius:999px;}

/* ---- 下部ナビ ---- */
.nav{
  position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:30;
  width:100%; max-width:480px; display:flex; border-top:1px solid var(--border);
  background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(14px);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
.nav__btn{flex:1; border:none; background:transparent; padding:7px 0 6px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--faint);}
.nav__btn.is-active{color:var(--accent);}
.nav__label{font-size:10.5px; font-weight:700;}

/* ---- ドロワー / トースト ---- */
.drawer-backdrop{position:absolute; inset:0; z-index:40; background:rgba(10,10,15,.4); display:flex; align-items:flex-end; animation:fadeIn .2s ease;}
.drawer{width:100%; background:var(--surface); border-radius:22px 22px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom)); animation:sheetUp .28s cubic-bezier(.22,1,.36,1);}
.drawer__grip{width:38px; height:4px; border-radius:99px; background:var(--border); margin:0 auto 16px;}
.toast{position:absolute; left:50%; bottom:84px; z-index:60; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:700; box-shadow:0 10px 30px -8px rgba(0,0,0,.4); animation:toastIn .25s ease; white-space:nowrap;}
</style>
</head>

/* =========================================================================
   状態
   ========================================================================= */
let UID = 100;
const uid = () => ++UID;
const dayGroups = (arr) => arr.map(g => ({ id: uid(), category: g.c, tasks: g.t.map(t => ({ id: uid(), hours: t.h, name: t.n })) }));

const state = {
  tab: 'report',            // report | tacos | settings
  theme: localStorage.getItem(THEME_KEY) || 'light',           // light | dark

  day: 'today',             // today(退勤報告) | tomorrow(朝会報告)

  // タコス

  editContactMemberId: '',
  editingContactBackup: null,
  blocks: [
    { id: uid(), recipients: [], count: 1, body: '' },
  ],
  templates: [
    { id: 't1', label: '感謝', body: 'いつもありがとうございます！とても助かりました🙏' },
    { id: 't2', label: 'レビュー', body: 'レビューありがとうございました！すごく勉強になりました' },
    { id: 't3', label: 'ヘルプ', body: '急ぎの対応ありがとうございました！本当に助かりました' },
  ],

let dragSession = null;

/* =========================================================================
   小物ヘルパー
   ========================================================================= */
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtHours = (h) => Number.isInteger(h) ? h.toFixed(1) : String(h);
function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function normalizeHours(value){
  return Math.max(0, Math.round((parseFloat(value) || 0) * 2) / 2);
}
function makeBlankBlock(){
  return { id: uid(), recipients: [], count: 1, body: '' };
}
function normalizeGroups(groups){
  if (!Array.isArray(groups)) return [];
  return groups.map(g => ({
    id: Number(g.id) || uid(),
    category: String(g.category || '新規案件'),
    tasks: Array.isArray(g.tasks) && g.tasks.length ? g.tasks.map(t => ({
      id: Number(t.id) || uid(),
      hours: normalizeHours(t.hours),
      name: String(t.name || ''),
    })) : [{ id: uid(), hours: 0.5, name: '' }],
  })).filter(g => g.category || g.tasks.length);
}
function normalizeUsage(usage){
  const date = todayKey();
  const src = usage && typeof usage === 'object' ? usage : {};
  return {
    date,
    consumed: src.date === date ? Math.max(0, Number(src.consumed || 0)) : 0,
    dailyLimit: Math.max(1, Number(src.dailyLimit || 5)),
  };
}
function syncDailyUsage(){
  const usage = normalizeUsage({ date: state.usageDate, consumed: state.accumulated, dailyLimit: 5 });
  state.usageDate = usage.date;
  state.accumulated = usage.consumed;
}
function serializableState(){
  syncDailyUsage();
  return {
    reportWork: {
      greeting: state.greeting,
      today: state.today,
      tomorrow: state.tomorrow,
    },
    reportPresets: state.presets,
    tacoContacts: state.contacts,
    tacoTemplates: state.templates,
    tacoBlocks: state.blocks,
    tacoUsage: { date: state.usageDate, consumed: state.accumulated, dailyLimit: 5 },
    tacoMode: state.tacoMode,
    webhookUrl: state.webhook,
    theme: state.theme,
    accentColor: state.tone,
  };
}
function persistLocal(){
  const data = serializableState();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  localStorage.setItem(WEBHOOK_KEY, data.webhookUrl || '');
  localStorage.setItem(THEME_KEY, data.theme || 'light');
}
function loadLocal(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }
  catch { return null; }
}
function applyStoredData(data){
  if (!data || typeof data !== 'object') return;
  let repairedBlockIds = false;
  let migratedContactMemberIds = false;
  let migratedRecipients = false;
  const work = data.reportWork || {};
  if (typeof work.greeting === 'string') state.greeting = work.greeting;
  if (Array.isArray(work.today)) state.today = normalizeGroups(work.today);
  if (Array.isArray(work.tomorrow)) state.tomorrow = normalizeGroups(work.tomorrow);
  if (Array.isArray(data.reportPresets)) state.presets = data.reportPresets.map(String).filter(Boolean);
  if (Array.isArray(data.tacoContacts)) {
    state.contacts = data.tacoContacts.map(c => {
      if (!Object.prototype.hasOwnProperty.call(c, 'memberId')) migratedContactMemberIds = true;
      return {
        id: Number(c.id) || uid(),
        name: String(c.name || '').trim(),
        memberId: String(c.memberId || '').trim(),
        freq: Math.max(0, Number(c.freq || c.sendCount || 0)),
      };
    }).filter(c => c.name);
    state.nextContactId = Math.max(1, ...state.contacts.map(c => c.id + 1));
  }
  if (Array.isArray(data.tacoTemplates)) {
    state.templates = data.tacoTemplates.map(t => ({
      id: String(t.id || ('tpl' + uid())),
      label: String(t.label || '').trim(),
      body: String(t.body || '').trim(),
    })).filter(t => t.label && t.body);
  }
  if (Array.isArray(data.tacoBlocks)) {
    const restoredIds = data.tacoBlocks.map(b => Number(b.id)).filter(id => Number.isSafeInteger(id) && id > 0);
    let nextBlockId = restoredIds.reduce((max, id) => Math.max(max, id), UID);
    const usedBlockIds = new Set();
    const blocks = data.tacoBlocks.map(b => {
      let id = Number(b.id);
      if (!Number.isSafeInteger(id) || id <= 0 || usedBlockIds.has(id)) {
        id = ++nextBlockId;
        repairedBlockIds = true;
      }
      usedBlockIds.add(id);
      UID = Math.max(UID, id);
      const recipients = Array.isArray(b.recipients) ? b.recipients.map(recipient => {
        if (recipient && typeof recipient === 'object' && !Array.isArray(recipient)) {
          if (!Object.prototype.hasOwnProperty.call(recipient, 'memberId')) migratedRecipients = true;
          return {
            name: String(recipient.name || '').trim(),
            memberId: String(recipient.memberId || '').trim(),
          };
        }
        migratedRecipients = true;
        const name = String(recipient || '').trim();
        const matches = state.contacts.filter(contact => contact.name === name);
        return { name, memberId: matches.length === 1 ? matches[0].memberId : '' };
      }).filter(recipient => recipient.name) : [];
      return {
        id,
        recipients,
        count: Math.max(1, Math.min(9, Number(b.count || 1))),
        body: String(b.body || ''),
      };
    });
    state.blocks = blocks.length ? blocks : [makeBlankBlock()];
  }
  if (data.tacoUsage) {
    const usage = normalizeUsage(data.tacoUsage);
    state.usageDate = usage.date;
    state.accumulated = usage.consumed;
  }
  if (data.tacoMode === 'merge' || data.tacoMode === 'split') state.tacoMode = data.tacoMode;
  if (typeof data.webhookUrl === 'string') state.webhook = data.webhookUrl;
  if (data.theme === 'light' || data.theme === 'dark') state.theme = data.theme;
  if (TONES[data.accentColor]) state.tone = data.accentColor;
  if (repairedBlockIds || migratedContactMemberIds || migratedRecipients) {
    persistLocal();
    if (userDocRef()) saveToFirestore();
  }
}
function persist(immediate = false){
  persistLocal();
  if (immediate) saveToFirestore();
  else debouncedFirestoreSave();
}
function firebaseReady(){
  return !!(window.firebase && firebase.initializeApp && firebase.auth && firebase.firestore);
}
function initFirebase(){
  if (auth) return;
  if (!firebaseReady()) {
    clearTimeout(firebaseRetry);
    firebaseRetry = setTimeout(initFirebase, 300);
    return;
  }
  if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    if (user) await loadFromFirestore();
    render();
  });
}
function userDocRef(){
  if (!currentUser || !db) return null;
  return db.collection('users').doc(currentUser.uid);
}
async function googleLogin(){
  initFirebase();
  if (!auth) {
    showToast('ログイン機能を読み込めませんでした');
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    await auth.signInWithPopup(provider);
  } catch (error) {
    showToast('ログインできませんでした');
    console.error(error);
  }
}
async function googleLogout(){
  if (!auth) return;
  await auth.signOut();
  currentUser = null;
  render();
}
async function loadFromFirestore(){
  const ref = userDocRef();
  if (!ref) return;
  try {
    const snap = await ref.get();
    if (snap.exists) {
      applyStoredData(snap.data());
      persistLocal();
    } else {
      await saveToFirestore();
    }
  } catch (error) {
    showToast('同期データを読み込めませんでした');
    console.error(error);
  }
}
async function saveToFirestore(){
  const ref = userDocRef();
  if (!ref) return;
  if (saving) {
    saveQueued = true;
    return;
  }
  saving = true;
  try {
    await ref.set({
      ...serializableState(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, { merge: true });
  } catch (error) {
    showToast('同期に失敗しました。入力内容はこの端末に保存されています');
    console.error(error);
  }
  saving = false;
  if (saveQueued) {
    saveQueued = false;
    await saveToFirestore();
  }
}
function debouncedFirestoreSave(){
  if (!currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToFirestore, 1500);
}
async function postToSlack(text){
  if (!state.webhook) throw new Error('Webhook is empty');
  await fetch(state.webhook, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'payload=' + encodeURIComponent(JSON.stringify({ text })),
  });
}
function showToast(message){
  toast(message);
}

function applyTheme(){
  const dark = state.theme === 'dark';
  const map = Object.assign({}, dark ? DARK : LIGHT, { '--accent': (TONES[state.tone] || TONES['青'])[dark ? 'd' : 'l'] });
  for (const k in map) document.documentElement.style.setProperty(k, map[k]);
}
function toast(msg){
  state.toast = msg;
  clearTimeout(state._toastTimer);
  render();
  state._toastTimer = setTimeout(() => { state.toast = ''; render(); }, 1900);
}
async function copyText(text, msg){
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
    else throw new Error('clipboard fallback');
  } catch(e) {
    const area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.focus();
    area.select();
    document.execCommand('copy');
    area.remove();
  }
  toast(msg);
}

/* 1日分を整形: ＜案件＞ + "Xh｜タスク名" の行 */
function formatDay(groups){
  return groups
    .filter(g => g.tasks.some(t => t.name.trim()))
    .map(g => {
      const lines = g.tasks.filter(t => t.name.trim()).map(t => fmtHours(t.hours) + 'h｜' + t.name.trim());
      return '＜' + (g.category.trim() || '案件') + '＞\n' + lines.join('\n');
    })
    .join('\n');
}

/* 退勤報告(本日) / 朝会報告(明日) の3まとまりを算出 */
function outputBlocks(){
  const todayBody = formatDay(state.today);
  const tmrBody   = formatDay(state.tomorrow);
  const greet = state.greeting.trim();
  const block1 = (greet ? greet + '\n\n' : '') + (todayBody || '（本日分が未入力です）');
  const block2 = todayBody || '（本日分が未入力です）';
  const block3 = tmrBody   || '（明日分が未入力です）';
  return { block1, block2, block3 };
}

/* タコス投稿の算出（mode: merge=個数別にまとめる / split=1人ずつ） */
const recipientName = recipient => typeof recipient === 'string' ? recipient : String(recipient && recipient.name || '');
const recipientMemberId = recipient => typeof recipient === 'string' ? '' : String(recipient && recipient.memberId || '');
const recipientPreviewLabel = recipient => recipientMemberId(recipient) ? '＠' + recipientName(recipient) : recipientName(recipient);
const recipientCopyLabel = recipient => recipientName(recipient);
const recipientSlackLabel = recipient => recipientMemberId(recipient) ? '<@' + recipientMemberId(recipient) + '>' : recipientName(recipient);
function tacoPosts(){
  const valid = state.blocks.filter(b => b.recipients.length && b.body.trim() && b.count > 0);
  if (state.tacoMode === 'split') {
    const posts = []; let n = 0;
    valid.forEach(b => b.recipients.forEach(r => {
      n++;
      const suffix = '\n' + b.body.trim() + '\n' + '🌮'.repeat(b.count);
      posts.push({
        num: n,
        count: b.count,
        people: 1,
        consume: b.count,
        previewText: recipientPreviewLabel(r) + suffix,
        text: recipientCopyLabel(r) + suffix,
        slackText: recipientSlackLabel(r) + suffix,
      });
    }));
    return posts;
  }
  const byCount = {};
  valid.forEach(b => { (byCount[b.count] = byCount[b.count] || []).push(b); });
  return Object.keys(byCount).map(Number).sort((a,b) => b - a).map((c, i) => {
    const bs = byCount[c];
    const previewText = bs.map(b => b.recipients.map(recipientPreviewLabel).join('\n') + '\n' + b.body.trim() + '\n' + '🌮'.repeat(c)).join('\n\n');
    const text = bs.map(b => b.recipients.map(recipientCopyLabel).join('\n') + '\n' + b.body.trim() + '\n' + '🌮'.repeat(c)).join('\n\n');
    const slackText = bs.map(b => b.recipients.map(recipientSlackLabel).join('\n') + '\n' + b.body.trim() + '\n' + '🌮'.repeat(c)).join('\n\n');
    const people = bs.reduce((a,b) => a + b.recipients.length, 0);
    return { num: i + 1, count: c, people, consume: people * c, previewText, text, slackText };
  });
}
function tacoDraftConsumption(){
  return state.blocks.reduce((sum, b) => sum + b.recipients.length * Math.max(0, Number(b.count || 0)), 0);
}
function reportHoursInfo(groups = groupsOf()){
  const value = groups.reduce((a,g) => a + g.tasks.reduce((x,t) => x + (t.name.trim()?t.hours:0), 0), 0);
  const dayHoursState = Math.round(value * 2) === 16 ? 'just' : value > 8 ? 'over' : 'under';
  return {
    value,
    text: fmtHours(value),
    color: dayHoursState === 'over' ? 'var(--danger)' : dayHoursState === 'under' ? 'var(--taco)' : 'var(--ok)',
    size: dayHoursState === 'just' ? '13.5px' : '15px',
  };
}

/* =========================================================================
   アクション（App.* ）— テンプレートの onclick / oninput から呼ぶ
   ========================================================================= */
const groupsOf = () => state.day === 'today' ? state.today : state.tomorrow;
function cloneGroups(groups){
  return groups.map(g => ({
    id: uid(),
    category: g.category,
    tasks: g.tasks.map(t => ({ id: uid(), hours: t.hours, name: t.name }))
  }));
}
const findCat = (catId) => groupsOf().find(g => g.id === catId);

const App = {
  /* ナビ / テーマ */
  go(tab){ state.tab = tab; renderFromTop(); },
  setTheme(t){ state.theme = t; applyTheme(); render(); },
  setTone(k){ state.tone = k; applyTheme(); render(); },

  /* 退勤/朝会 切替 */
  setDay(d){ state.day = d; render(); },

  /* 挨拶文 */
  toggleGreeting(){ state.greetingOpen = !state.greetingOpen; render(); },
  setGreeting(v){ state.greeting = v; },

  /* 案件 / タスク */
  startEditCat(catId){ state.editingCat = catId; render(); setTimeout(() => { const el = document.querySelector('[data-k="cat-'+catId+'"]'); if(el){ el.focus(); el.select && el.select(); } }, 20); },
  stopEditCat(){ state.editingCat = null; render(); },
  catKey(e){ if(e.key === 'Enter'){ state.editingCat = null; render(); } },
  setCategory(catId, v){ const g = findCat(catId); if(g) g.category = v; },
  deleteCategory(catId){ const arr = groupsOf(); const i = arr.findIndex(g => g.id === catId); if(i>=0) arr.splice(i,1); render(); },
  addCategory(){ groupsOf().push({ id: uid(), category: '新規案件', tasks: [{ id: uid(), hours: 0.5, name: '' }] }); render(); },
  addTask(catId, name){ const g = findCat(catId); if(g) g.tasks.push({ id: uid(), hours: 0.5, name: name }); render(); },
  setTaskName(catId, taskId, v){ const g = findCat(catId); const t = g && g.tasks.find(t => t.id === taskId); if(t) t.name = v; },
  setTaskHours(catId, taskId, v){ const g = findCat(catId); const t = g && g.tasks.find(t => t.id === taskId); if(t) t.hours = Math.max(0, Math.round((parseFloat(v)||0)*2)/2); render(); },
  bumpHours(catId, taskId, d){ const g = findCat(catId); const t = g && g.tasks.find(t => t.id === taskId); if(t) t.hours = Math.max(0, Math.round((t.hours + d)*2)/2); render(); },
  deleteTask(catId, taskId){ const g = findCat(catId); if(g){ const i = g.tasks.findIndex(t => t.id === taskId); if(i>=0) g.tasks.splice(i,1);} render(); },

  /* Pointer Events 並び替え */
  pointerStartCat(catId, e){ this.startDragCat(catId, e); },
  pointerStartTask(catId, taskId, e){ this.startDragTask(catId, taskId, e); },
  startDragCat(catId, e){
    const handle = e && e.currentTarget;
    const item = handle && handle.closest('[data-cat-id]');
    const list = item && item.parentElement;
    if(item && list) this.startDrag(e, item, list, { type:'cat', catId });
  },
  startDragTask(catId, taskId, e){
    const handle = e && e.currentTarget;
    const item = handle && handle.closest('[data-task-id]');
    const list = item && item.parentElement;
    if(item && list) this.startDrag(e, item, list, { type:'task', catId, taskId });
  },
  startDrag(e, item, list, meta){
    if(!e || !item || !list) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(dragSession) return;
    const handle = e.currentTarget;
    const kids = Array.from(list.children).filter(node => node.hasAttribute('data-item'));
    const fromIndex = kids.indexOf(item);
    if(fromIndex < 0) return;
    const rects = kids.map(node => {
      const r = node.getBoundingClientRect();
      return { el: node, top: r.top, h: r.height, center: r.top + r.height / 2 };
    });
    let gap = rects.length > 1 ? rects[1].top - (rects[0].top + rects[0].h) : 0;
    if(gap < 0) gap = 0;
    dragSession = {
      item, list, handle, meta, pid: e.pointerId, startY: e.clientY,
      rects, kids, fromIndex, gap, baseCenter: rects[fromIndex].center,
      top0: rects[0].top, targetOrder: null,
    };
    item.classList.add('dragging');
    const cat = item.closest('.cat');
    if(cat && cat !== item){
      cat.style.overflow = 'visible';
      cat.style.zIndex = '60';
      dragSession.cat = cat;
    }
    try{ handle.setPointerCapture(e.pointerId); }catch(x){}
    this._moveDrag = ev => this.moveDrag(ev);
    this._endDrag = () => this.endDrag();
    document.addEventListener('pointermove', this._moveDrag);
    document.addEventListener('pointerup', this._endDrag);
    document.addEventListener('pointercancel', this._endDrag);
    e.preventDefault();
  },
  moveDrag(e){
    if(!dragSession) return;
    e.preventDefault();
    const d = dragSession;
    const dy = e.clientY - d.startY;
    d.item.style.transform = 'translateY(' + dy + 'px) scale(1.03)';
    const center = d.baseCenter + dy;
    const others = d.rects.filter(r => r.el !== d.item);
    let insertIdx = others.length;
    for(let i = 0; i < others.length; i++){
      if(center < others[i].center){ insertIdx = i; break; }
    }
    const newOrder = others.slice();
    newOrder.splice(insertIdx, 0, { el: d.item, dragged: true });
    const draggedH = d.rects[d.fromIndex].h;
    let cursor = d.top0;
    for(let i = 0; i < newOrder.length; i++){
      const r = newOrder[i];
      if(r.dragged){
        cursor += draggedH + d.gap;
        continue;
      }
      r.el.style.transform = 'translateY(' + (cursor - r.top) + 'px)';
      cursor += r.h + d.gap;
    }
    d.targetOrder = newOrder;
  },
  endDrag(){
    if(!dragSession) return;
    const d = dragSession;
    dragSession = null;
    d.item.classList.remove('dragging');
    d.kids.forEach(node => { node.style.transition = 'none'; });
    if(d.targetOrder){
      d.targetOrder.forEach(r => {
        r.el.style.transform = '';
        d.list.appendChild(r.el);
      });
    } else {
      d.kids.forEach(node => { node.style.transform = ''; });
    }
    d.item.style.transform = '';
    if(d.cat){
      d.cat.style.overflow = '';
      d.cat.style.zIndex = '';
    }
    void d.list.offsetHeight;
    d.kids.forEach(node => { node.style.transition = ''; });
    document.removeEventListener('pointermove', this._moveDrag);
    document.removeEventListener('pointerup', this._endDrag);
    document.removeEventListener('pointercancel', this._endDrag);
    try{ d.handle.releasePointerCapture(d.pid); }catch(x){}
    this._moveDrag = null;
    this._endDrag = null;
    this.applyDragOrder(d);
  },
  pointerEnd(){ this.endDrag(); },
  applyDragOrder(d){
    const meta = d.meta;
    if(meta.type === 'cat'){
      const ids = Array.from(d.list.querySelectorAll(':scope > [data-cat-id]')).map(el => Number(el.getAttribute('data-cat-id')));
      const arr = groupsOf();
      const byId = new Map(arr.map(g => [g.id, g]));
      const ordered = ids.map(id => byId.get(id)).filter(Boolean);
      if(ordered.length === arr.length) arr.splice(0, arr.length, ...ordered);
    }
    if(meta.type === 'task'){
      const g = findCat(meta.catId);
      if(g){
        const ids = Array.from(d.list.querySelectorAll(':scope > [data-task-id]')).map(el => Number(el.getAttribute('data-task-id')));
        const byId = new Map(g.tasks.map(t => [t.id, t]));
        const ordered = ids.map(id => byId.get(id)).filter(Boolean);
        if(ordered.length === g.tasks.length) g.tasks.splice(0, g.tasks.length, ...ordered);
      }
    }
    persist();
  },

  /* 出力プレビュー / コピー */
  toggleOutput(){ state.outputOpen = !state.outputOpen; render(); },
  copyBlock(which){ const o = outputBlocks(); if(which===1) copyText(o.block1,'退勤報告をコピーしました'); else if(which===2) copyText(o.block2,'今日やったことをコピーしました'); else copyText(o.block3,'明日やることをコピーしました'); },
  copyAll(){ const o = outputBlocks(); copyText(o.block1 + '\n\n' + o.block2 + '\n\n' + o.block3, '3まとまりをコピーしました'); },
  quickCopy(){
    if (state.day === 'today') {
      state.today = cloneGroups(state.tomorrow);
      toast('朝会報告の内容を退勤報告へコピーしました');
    } else {
      state.tomorrow = cloneGroups(state.today);
      toast('退勤報告の内容を朝会報告へコピーしました');
    }
    render();
  },
  async sendSlack(){
    if (!state.webhook) {
      toast('Slack送信先を設定してください');
      state.tab = 'settings';
      render();
      return;
    }
    const o = outputBlocks();
    try {
      await postToSlack(o.block1);
      await postToSlack(o.block2);
      await postToSlack(o.block3);
      toast('Slackへ送信しました');
    } catch (error) {
      toast('Slackへ送信できませんでした');
      console.error(error);
    }
  },

  /* プリセット */
  setNewPreset(v){ state.newPreset = v; },
  addPreset(){ const v = state.newPreset.trim(); if(!v) return; state.presets.push(v); state.newPreset=''; render(); },
  removePreset(name){ state.presets = state.presets.filter(p => p !== name); render(); },

  /* タコス: ブロック */
  addBlock(){ state.blocks.push({ id: uid(), recipients: [], count: 1, body: '' }); render(); },
  removeBlock(id){ state.blocks = state.blocks.filter(b => b.id !== id); render(); },
  bumpCount(id, d){ const b = state.blocks.find(b => b.id === id); if(b) b.count = Math.max(1, Math.min(9, b.count + d)); render(); },
  setBody(id, v, shouldRender){ const b = state.blocks.find(b => b.id === id); if(b) b.body = v; if(shouldRender) render(); },
  pickRecipient(id, contactId){
    const b = state.blocks.find(b => b.id === id);
    const contact = state.contacts.find(c => c.id === Number(contactId));
    if(b && contact){
      const recipient = { name: contact.name, memberId: String(contact.memberId || '').trim() };
      const selected = b.recipients.some(r => recipientName(r) === recipient.name && recipientMemberId(r) === recipient.memberId);
      if(!selected){
        b.recipients.push(recipient);
        contact.freq = Math.max(0, Number(contact.freq || 0)) + 1;
      }
    }
    render();
  },
  removeRecipient(id, recipientIndex){ const b = state.blocks.find(b => b.id === id); if(b) b.recipients = b.recipients.filter((_, index) => index !== recipientIndex); render(); },

  /* タコス: 出力 */
  toggleTacoOutput(){ state.tacoOutputOpen = !state.tacoOutputOpen; render(); },
  setTacoMode(m){ state.tacoMode = m; render(); },
  copyPost(num){ const p = tacoPosts().find(p => p.num === num); if(!p) return; syncDailyUsage(); state.accumulated += p.consume; render(); copyText(p.text, '投稿'+num+'をコピー'); },
  copyAllTacos(){ const posts = tacoPosts(); if(!posts.length) return; const all = posts.map(p => p.text).join('\n\n'); syncDailyUsage(); state.accumulated += posts.reduce((a,p)=>a+p.consume,0); render(); copyText(all, '全'+posts.length+'投稿をコピー'); },
  async sendTacos(){
    const posts = tacoPosts();
    if(!posts.length) return;
    if(!state.webhook){ toast('先に設定画面で送信先を登録してください'); return; }
    try {
      for(const post of posts) await postToSlack(post.slackText);
      syncDailyUsage();
      state.accumulated += posts.reduce((total, post) => total + post.consume, 0);
      persist(true);
      toast('Slackへ送信しました');
    } catch(error) {
      toast('Slackへ送信できませんでした');
      console.error(error);
    }
  },

  /* 設定: Slack / 連絡先 / テンプレート */
  setWebhook(v){ state.webhook = v; },
  toggleContacts(){ state.contactsOpen = !state.contactsOpen; render(); },
  setBulkText(v){ state.bulkText = v; },
  bulkImport(){
    const lines = state.bulkText.split('\n').map(line => line.trim()).filter(Boolean);
    if(!lines.length){ toast('名前とメンバーIDを貼り付けてください'); return; }
    let added = 0, updated = 0, skipped = 0, duplicateSkipped = 0, invalidSkipped = 0;
    lines.forEach(line => {
      const comma = line.indexOf(',');
      const name = (comma >= 0 ? line.slice(0, comma) : line).replace(/^[＠@\s]+/,'').trim();
      const memberId = comma >= 0 ? line.slice(comma + 1).trim() : '';
      if(!name || !memberId){ skipped++; invalidSkipped++; return; }
      const matches = state.contacts.filter(c => c.name === name);
      if(!matches.length){
        state.contacts.push({ id: state.nextContactId++, name, memberId, freq: 0 });
        added++;
        return;
      }
      if(matches.length === 1){
        matches[0].memberId = memberId;
        updated++;
        return;
      }
      const exact = matches.find(c => String(c.memberId || '').trim() === memberId);
      if(exact){
        exact.memberId = memberId;
        updated++;
      } else {
        skipped++;
        duplicateSkipped++;
      }
    });
    state.bulkText = '';
    render();
    const notes = [];
    if(duplicateSkipped) notes.push('同名重複のため手動で確認 ' + duplicateSkipped + '件');
    if(invalidSkipped) notes.push('入力不足 ' + invalidSkipped + '件');
    toast('追加' + added + '・更新' + updated + '・スキップ' + skipped + (notes.length ? '（' + notes.join('、') + '）' : ''));
  },
  startEditContact(id){ const c = state.contacts.find(c => c.id === id); if(!c) return; state.editingContactId = id; state.editContactName = c.name; state.editContactMemberId = String(c.memberId || ''); state.editingContactBackup = { name: c.name, memberId: String(c.memberId || '') }; render(); },
  setEditContactName(v){ state.editContactName = v; },
  setEditContactMemberId(v){ state.editContactMemberId = v; },
  commitEditContact(id){
    const c = state.contacts.find(c => c.id === id);
    if(!c) return;
    const backup = state.editingContactBackup || { name: c.name, memberId: String(c.memberId || '') };
    const newName = state.editContactName.replace(/^[＠@\s]+/,'').trim();
    const newMemberId = state.editContactMemberId.trim();
    if(!newName || !newMemberId){
      c.name = backup.name;
      c.memberId = backup.memberId;
      state.editingContactId = null;
      state.editContactName = '';
      state.editContactMemberId = '';
      state.editingContactBackup = null;
      if(!newName && !newMemberId) toast('名前とメンバーIDを入力してください');
      else if(!newName) toast('名前を入力してください');
      else toast('メンバーIDを入力してください');
      return;
    }
    c.name = newName;
    c.memberId = newMemberId;
    state.editingContactId = null;
    state.editContactName = '';
    state.editContactMemberId = '';
    state.editingContactBackup = null;
    render();
  },
  cancelEditContact(){ state.editingContactId = null; state.editContactName = ''; state.editContactMemberId = ''; state.editingContactBackup = null; render(); },
  removeContact(id){ const c = state.contacts.find(c => c.id === id); state.contacts = state.contacts.filter(c => c.id !== id); if(c) state.blocks.forEach(b => { b.recipients = b.recipients.filter(r => recipientName(r) !== c.name || recipientMemberId(r) !== String(c.memberId || '')); }); render(); },
  setTplLabel(v){ state.newTemplateLabel = v; },
  setTplBody(v){ state.newTemplateBody = v; },
  addTemplate(){ const label = state.newTemplateLabel.trim(), body = state.newTemplateBody.trim(); if(!label || !body){ toast('ラベルと文面を入力してください'); return; } state.templates.push({ id: 'tpl'+uid(), label, body }); state.newTemplateLabel=''; state.newTemplateBody=''; render(); toast('テンプレートを追加しました'); },
  startEditTemplate(id){ const t = state.templates.find(t => t.id === id); if(!t) return; state.editingTemplateId = id; state.editTemplateLabel = t.label; state.editTemplateBody = t.body; state.editingTemplateBackup = { label: t.label, body: t.body }; render(); },
  setEditTemplateLabel(v){ state.editTemplateLabel = v; },
  setEditTemplateBody(v){ state.editTemplateBody = v; },
  commitEditTemplate(id){
    const t = state.templates.find(t => t.id === id);
    if(!t) return;
    const label = state.editTemplateLabel.trim();
    const body = state.editTemplateBody.trim();
    if(!label || !body){
      const backup = state.editingTemplateBackup || { label: t.label, body: t.body };
      t.label = backup.label;
      t.body = backup.body;
      state.editingTemplateId = null;
      state.editTemplateLabel = '';
      state.editTemplateBody = '';
      state.editingTemplateBackup = null;
      render();
      return;
    }
    t.label = label;
    t.body = body;
    state.editingTemplateId = null;
    state.editTemplateLabel = '';
    state.editTemplateBody = '';
    state.editingTemplateBackup = null;
    render();
  },
  cancelEditTemplate(){ state.editingTemplateId = null; state.editTemplateLabel = ''; state.editTemplateBody = ''; state.editingTemplateBackup = null; render(); },
  removeTemplate(id){ state.templates = state.templates.filter(t => t.id !== id); render(); },
};
window.App = App;

const LOCAL_ONLY_ACTIONS = new Set(['go','setDay','toggleGreeting','startEditCat','stopEditCat','toggleContacts','toggleOutput','toggleTacoOutput','pointerStartCat','pointerStartTask','pointerEnd','startEditContact','cancelEditContact','startEditTemplate','cancelEditTemplate']);
const SAVE_ACTIONS = new Set([
  'setTheme','setTone','setGreeting','setCategory','deleteCategory','addCategory','addTask',
  'setTaskName','setTaskHours','bumpHours','deleteTask',
  'addPreset','removePreset','addBlock','removeBlock','bumpCount','setBody','pickRecipient',
  'removeRecipient','setTacoMode','setWebhook','bulkImport','removeContact','addTemplate',
  'commitEditContact','commitEditTemplate','removeTemplate','copyPost','copyAllTacos','quickCopy',
]);
const IMMEDIATE_SAVE_ACTIONS = new Set(['bulkImport','removeContact','commitEditContact','addPreset','removePreset','addTemplate','commitEditTemplate','removeTemplate','copyPost','copyAllTacos','quickCopy','setTheme','setTone','setWebhook']);
Object.keys(App).forEach((name) => {
  if (!LOCAL_ONLY_ACTIONS.has(name) && !SAVE_ACTIONS.has(name)) return;
  const original = App[name];
  App[name] = function(...args){
    const result = original.apply(App, args);
    if (LOCAL_ONLY_ACTIONS.has(name)) persistLocal();
    if (SAVE_ACTIONS.has(name)) persist(IMMEDIATE_SAVE_ACTIONS.has(name));
    return result;
  };
});

/* ---- タコスタブ ---- */
function viewTacos(){
  const blocks = state.blocks.map((b, i) => {
    const recipients = b.recipients.map((r, recipientIndex) =>
      `<span class="rcpt">${esc(recipientName(r))}<button class="icon-btn" style="color:var(--accent);opacity:.7;padding:0;" onclick="App.removeRecipient(${b.id},${recipientIndex})" aria-label="外す">${I.closeSm}</button></span>`
    ).join('');
    const options = state.contacts.slice().sort((a,c)=>c.freq-a.freq)
      .filter(c => String(c.memberId || '').trim())
      .filter(c => !b.recipients.some(r => recipientName(r) === c.name && recipientMemberId(r) === String(c.memberId || '')))
      .map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    const tplChips = state.templates.map(t => {
      const active = b.body.trim() === t.body;
      return `<button class="tpl-chip ${active?'is-active':''}" onclick="App.setBody(${b.id},'${esc(t.body).replace(/'/g,"\\'")}',true)">${esc(t.label)}</button>`;
    }).join('');
    return `
    <div class="block">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;">
        <div style="flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;padding-top:3px;">
          ${recipients || `<span style="font-size:12.5px;font-weight:600;color:var(--faint);padding:5px 0;">宛先を選択してください</span>`}
        </div>
        <div style="flex:none;display:flex;align-items:center;gap:8px;">
          <div class="count">
            <button class="count__btn" onclick="App.bumpCount(${b.id},-1)">−</button>
            <div class="count__val mono">${b.count}<span style="font-size:10px;">🌮</span></div>
            <button class="count__btn" onclick="App.bumpCount(${b.id},1)">+</button>
          </div>
          <button class="icon-btn" style="width:44px;height:44px;padding:4px;border-radius:8px;" onclick="App.removeBlock(${b.id})" aria-label="削除">${I.close}</button>
        </div>
      </div>
      <div class="select-wrap">
        <select class="select" onchange="App.pickRecipient(${b.id},this.value); this.value='';">
          <option value="" disabled selected>＋ 宛先を追加（連名可）</option>
          ${options}
        </select>
        <span class="select-wrap__chev">${I.chev}</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;">${tplChips}</div>
      <textarea class="body-input" rows="2" data-k="block-${b.id}" oninput="App.setBody(${b.id},this.value)" placeholder="文面を入力">${esc(b.body)}</textarea>
    </div>`;
  }).join('');

  const posts = tacoPosts();
  const postRows = posts.map(p => `
    <div class="post">
      <div class="post__head">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:12px;font-weight:700;">投稿 ${p.num}</span>
          <span class="post__badge mono">×${p.count}🌮</span>
        </div>
        <button class="out__copy" onclick="App.copyPost(${p.num})">${I.copySm}コピー</button>
      </div>
      <div class="post__body">${esc(p.previewText)}</div>
      <div class="post__meta mono">消費: ${p.people}人 × ${p.count}個 = ${p.consume}個</div>
    </div>`).join('');

  const modeHint = state.tacoMode === 'split' ? '宛先を1人ずつ別の投稿に分けます（連名も分割）。' : '同じ個数の宛先を1つの投稿にまとめます。';
  const mentionHint = 'Slackに貼り付けた後、各名前の前に＠を付けると一括でメンションされます。';

  return `
  <div class="tab">
    <div style="display:flex;flex-direction:column;gap:11px;">${blocks}</div>
    <button class="btn-dashed" onclick="App.addBlock()">${I.plus}宛先＋文面ブロックを追加</button>

    <div class="card" style="padding:15px;">
      <button class="collapse-head" onclick="App.toggleTacoOutput()">
        <span style="font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;">出力プレビュー</span>
        <span style="display:flex;align-items:center;gap:8px;color:var(--faint);">
          <span style="font-size:11px;">${posts.length}投稿</span>
          <span class="chev" style="transform:rotate(${state.tacoOutputOpen?180:0}deg);">${I.chev}</span>
        </span>
      </button>
      <div class="seg" style="border-radius:11px;margin-top:12px;">
        <button class="seg__btn ${state.tacoMode==='merge'?'is-active':''}" style="font-size:12.5px;padding:9px;border-radius:8px;" onclick="App.setTacoMode('merge')">投稿をまとめる</button>
        <button class="seg__btn ${state.tacoMode==='split'?'is-active':''}" style="font-size:12.5px;padding:9px;border-radius:8px;" onclick="App.setTacoMode('split')">個別で送る</button>
      </div>
      <div style="font-size:11px;color:var(--faint);margin-top:8px;padding:0 2px;line-height:1.5;">${modeHint}</div>
      ${state.tacoOutputOpen ? `<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">${postRows || `<div style="padding:14px;text-align:center;font-size:12px;color:var(--faint);">宛先と文面を入力すると、ここに投稿が表示されます。</div>`}</div>` : ''}
      <div style="display:flex;gap:6px;align-items:flex-start;font-size:10.8px;color:var(--muted);margin-top:6px;padding:8px 9px;line-height:1.55;border:1px solid var(--border2);border-radius:10px;background:var(--surface2);">
        <span style="flex:none;">ⓘ</span><span>${mentionHint}</span>
      </div>
      ${posts.length ? `<div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn-primary" style="flex:1;min-width:0;padding:12px;border-radius:12px;font-size:13.5px;" onclick="App.copyAllTacos()">${I.copy}全${posts.length}投稿を一括コピー</button>
        <button class="btn-ghost" style="flex:none;padding:12px 16px;border-radius:12px;font-size:13.5px;" onclick="App.sendTacos()">Slack送信</button>
      </div>` : ''}
    </div>
  </div>`;
}

/* =========================================================================
   render — 状態から全画面を組み立て、フォーカス位置を復元
   ========================================================================= */
function renderFromTop(){
  render({ scrollToTop: true });
}
function render({ scrollToTop = false } = {}){
  const app = document.getElementById('app');
  if (!app) return;
  syncDailyUsage();
  app.dataset.tab = state.tab;

  // 再描画前にフォーカス中の入力欄とキャレット位置を記録
  const active = document.activeElement;
  const fk = active && active.getAttribute ? active.getAttribute('data-k') : null;
  let selStart = null, selEnd = null;
  if (fk) { try { selStart = active.selectionStart; selEnd = active.selectionEnd; } catch(e){} }
  const oldScroll = app.querySelector('.scroll');
  const scrollTop = oldScroll ? oldScroll.scrollTop : 0;
  const oldContactScroll = app.querySelector('.contact-scroll');
  const contactScrollTop = oldContactScroll ? oldContactScroll.scrollTop : 0;

  let body = '';
  if (state.tab === 'report')   body = viewReport();
  if (state.tab === 'tacos')    body = viewTacos();
  if (state.tab === 'settings') body = viewSettings();

  app.innerHTML =
    viewHeader() +
    viewSubheader() +
    `<div class="scroll">${body}</div>` +
    viewNav() +
    (state.toast ? `<div class="toast">${esc(state.toast)}</div>` : '');
  // フォーカス復元
  if (fk) {
    const el = app.querySelector('[data-k="' + (window.CSS && CSS.escape ? CSS.escape(fk) : fk) + '"]');
    if (el) {
      try { el.focus({ preventScroll: true }); } catch(e) { el.focus(); }
      if (selStart != null) { try { el.setSelectionRange(selStart, selEnd); } catch(e){} }
    }
  }

  const newScroll = app.querySelector('.scroll');
  if (newScroll) newScroll.scrollTop = scrollToTop ? 0 : scrollTop;
  const newContactScroll = app.querySelector('.contact-scroll');
  if (newContactScroll) {
    newContactScroll.scrollTop = scrollToTop ? 0 : contactScrollTop;
  }
}

/* 起動 */
function boot(){
  applyStoredData(loadLocal());
  applyTheme();
  render();
  initFirebase();
  window.googleLogin = googleLogin;
  window.googleLogout = googleLogout;
  window.userDocRef = userDocRef;
  window.loadFromFirestore = loadFromFirestore;
  window.saveToFirestore = saveToFirestore;
  window.debouncedFirestoreSave = debouncedFirestoreSave;
  window.postToSlack = postToSlack;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
